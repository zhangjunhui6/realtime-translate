services:
  - type: web
    name: realtime-translate
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: RT_HOST
        value: 0.0.0.0
      # Default: local free MT. Set YOUDAO_* secrets in Render dashboard to enable 有道.
      - key: TRANSLATE_PROVIDER
        value: local
      - key: YOUDAO_APP_KEY
        sync: false
      - key: YOUDAO_APP_SECRET
        sync: false
      - key: XUNFEI_APP_ID
        sync: false
      - key: XUNFEI_API_KEY
        sync: false
      - key: XUNFEI_API_SECRET
        sync: false
      - key: VOLC_ARK_API_KEY
        sync: false
      - key: VOLC_ARK_MODEL
        sync: false
      - key: VOLC_ACCESS_KEY
        sync: false
      - key: VOLC_SECRET_KEY
        sync: false
