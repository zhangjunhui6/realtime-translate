services:
  - type: web
    name: realtime-translate
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build -w web
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RT_HOST
        value: 0.0.0.0
      # Free tier: local = browser speech + free MT (no ffmpeg).
      # For 有道/讯飞 cloud ASR (needs ffmpeg), use paid Docker or keep text input.
      - key: TRANSLATE_PROVIDER
        value: local
      - key: YOUDAO_APP_KEY
        sync: false
      - key: YOUDAO_APP_SECRET
        sync: false
      - key: XUNFEI_APP_ID
        sync: false
      - key: XUNFEI_API_KEY
        sync: false
      - key: XUNFEI_API_SECRET
        sync: false
      - key: VOLC_ARK_API_KEY
        sync: false
      - key: VOLC_ARK_MODEL
        sync: false
      - key: VOLC_ACCESS_KEY
        sync: false
      - key: VOLC_SECRET_KEY
        sync: false
